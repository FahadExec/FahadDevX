<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FahadExec</title>
    <!-- استدعاء خطوط Google وتحديث مكتبة FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0d12;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            position: relative;
        }

        /* خلفية ضبابية متحركة فخمة */
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #05070a 0%, #11141d 100%);
            overflow: hidden;
        }

        .smoke-layer {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%),
                        radial-gradient(ellipse at 30% 40%, rgba(100, 110, 130, 0.08) 0%, transparent 70%),
                        radial-gradient(ellipse at 70% 60%, rgba(50, 60, 80, 0.06) 0%, transparent 60%);
            mix-blend-mode: overlay;
            animation: driftClouds 25s infinite linear alternate;
        }

        .smoke-layer-2 {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 50% 30%, rgba(255, 255, 255, 0.04) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(80, 90, 110, 0.05) 0%, transparent 70%);
            animation: driftClouds2 35s infinite linear alternate-reverse;
        }

        @keyframes driftClouds {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        @keyframes driftClouds2 {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(-5deg); }
        }

        /* بطاقة البروفايل الرئيسية */
        .profile-card {
            background: rgba(13, 17, 26, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 45px 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            z-index: 1;
        }

        /* صورة البروفايل من جيت هوب */
        .avatar-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 16px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.12);
            object-fit: cover;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        /* الاسم بخط الكاتب الفخم */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
        }

        /* أيقونة الديفيلوبر */
        .status-badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            margin-bottom: 12px;
            color: #3b82f6;
            font-size: 13px;
        }

        /* النص الثابت تحت الأيقونة */
        .bio-text {
            color: #3b82f6;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .location {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .location i {
            color: #10b981;
            font-size: 11px;
        }

        /* بطاقة ديسكورد ثابتة ومضمونة */
        .discord-box {
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .discord-avatar-wrap {
            position: relative;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
        }

        .discord-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .discord-status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 11px;
            height: 11px;
            background-color: #10b981;
            border: 2px solid #111827;
            border-radius: 50%;
        }

        .discord-info .name {
            font-size: 13px;
            color: #f3f4f6;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .discord-info .status-text {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }

        /* أيقونتين فقط (X و GitHub) */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d1d5db;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <!-- الخلفية الضبابية المتحركة -->
    <div class="animated-bg">
        <div class="smoke-layer"></div>
        <div class="smoke-layer-2"></div>
    </div>

    <div class="profile-card">
        <!-- صورة البروفايل من جيت هوب -->
        <div class="avatar-container">
            <img src="https://github.com/FahadExec.png" alt="FahadExec" class="avatar">
        </div>

        <!-- الاسم بخط الكاتب الفخم -->
        <h1>FahadExec</h1>

        <!-- أيقونة الديفيلوبر -->
        <div class="status-badge">
            <i class="fa-solid fa-code"></i>
        </div>

        <!-- النص الثابت تحت الأيقونة -->
        <div class="bio-text">Software Developer</div>

        <!-- الموقع المحدث -->
        <div class="location">
            <i class="fa-solid fa-location-dot">C</i> Saudi Arabia
        </div>

        <!-- بطاقة ديسكورد ثابتة ومضمونة -->
        <div class="discord-box">
            <div class="discord-avatar-wrap">
                <img src="https://github.com/FahadExec.png" alt="Discord Avatar" class="discord-avatar">
                <div class="discord-status-dot"></div>
            </div>
            <div class="discord-info">
                <div class="name">FahadExec</div>
                <div class="status-text">Active on Development</div>
            </div>
        </div>
        
        <!-- أيقونتين فقط (X و GitHub) -->
        <div class="social-icons">
            <a href="https://x.com/FahadExec" target="_blank" class="social-icon" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://github.com/FahadExec" target="_blank" class="social-icon" title="GitHub"><i class="fa-brands fa-github"></i></a>
        </div>
    </div>

    <script>
        // تأثير الـ Typewriter المتحرك على عنوان المتصفح (Tab Title) مثل مواقع guns.lol
        const titles = [
            "FfahadExec",
            "FahadExec",
            "FahadExec - Developer",
            "FahadExec 👑"
        ];
        
        let index = 0;
        let charIndex = 0;
        let isDeleting = false;
        let speed = 150;

        function typeWriterTitle() {
            let current = index % titles.length;
            let fullText = titles[current];

            if (isDeleting) {
                charIndex--;
                speed = 75;
            } else {
                charIndex++;
                speed = 150;
            }

            document.title = fullText.substring(0, charIndex);

            if (!isDeleting && charIndex === fullText.length) {
                isDeleting = true;
                speed = 2000; // وقت الانتظار بعد ما تكتمل الجملة
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                index++;
                speed = 500;
            }

            setTimeout(typeWriterTitle, speed);
        }

        typeWriterTitle();
    </script>
</body>
</html>
